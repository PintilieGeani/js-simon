<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
    <main>
        <div class="container">
            
            <div class= "justify-content-center pt-5" id="header">
                <h2>Ti farò vedere 5 numeri per 3 secondi e tu dovrai dirmi quali di questi ricordi.</h2>
                <h3>Pronto per cominciare?</h3>
              <ul class="d-flex gap-5 list-unstyled d-none " id="lista-principale">
              </ul>
              <button id="bottone">Iniziamo</button>
            </div>
            <div id="inserimento" class="d-none">
                <form action="" id="numeri-form">
                    <h2>Inserirsci i numeri che ricordi</h2>
                    <label for="n1">Primo numero</label>
                    <input type="number" id="n1">
                    <label for="n2">Secondo numero</label>
                    <input type="number" id="n2">
                    <label for="n3">Terzo numero</label>
                    <input type="number" id="n3">
                    <label for="n4">Quarto numero</label>
                    <input type="number" id="n4">
                    <label for="n5">Quinto numero</label>
                    <input type="number" id="n5">
                    <button id="submit">Submit</button>
                </form>
            </div>
            <div id="footer" class="d-none">
                <h2>Risultato</h2>
                <p id="risultato"></p>
                <button type="button" id="resetta">Ricominciamo</button>
            </div>
        </div>
    </main>







    <script src="./js/script.js"></script>
</body>
</html>
